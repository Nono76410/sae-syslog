<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogAI — Diagnostic Réseau Linkt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-result { display: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="mb-4 text-center">
            <h1 class="fw-bold text-primary">LogAI</h1>
            <p class="text-muted">Assistant de diagnostic et d'analyse de logs réseau (Linkt)</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <label for="rawLog" class="form-label fw-bold">Coller l'extrait de log brut :</label>
                        <textarea id="rawLog" class="form-row form-control font-monospace mb-3" rows="5" placeholder="Ex: %OSPF-5-ADJCHG: Process 1, Nbr 10.0.0.2 on Vlan10 from LOADING to FULL, Loading Done"></textarea>
                        <button id="btnAnalyze" class="btn btn-primary w-100 fw-bold" onclick="analyzeLog()">
                            🔍 Analyser le Log
                        </button>
                    </div>
                </div>

                <div id="loading" class="text-center my-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Analyse en cours via IA LOCAL & Moteur Gemini si je ne sais pas...</p>
                </div>

                <!-- Carte de résultat -->
                <div id="resultCard" class="card shadow-sm card-result border-start border-4 border-primary">
                    <div class="card-body">
                        <h4 class="card-title mb-3 fw-bold">Rapport de Diagnostic</h4>
                        
                        <div class="mb-3">
                            <span class="badge bg-danger" id="badgeCriticite">Criticit&eacute;</span>
                            <span class="badge bg-secondary" id="badgeSource">Source</span>
                        </div>

                        <h5 class="fw-bold text-secondary">1. Cause Racine</h5>
                        <p id="resExplication" class="card-text"></p>

                        <h5 class="fw-bold text-secondary mt-3">2. Solution Corrective</h5>
                        <p id="resSolution" class="card-text font-monospace bg-light p-3 rounded"></p>

                        <div class="mt-3 text-end">
                            <small class="text-muted">Extrait doc : <span id="resDocFile"></span></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeLog() {
            const logText = document.getElementById('rawLog').value.trim();
            if (!logText) {
                alert('Veuillez coller un log brut avant de lancer l\'analyse.');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ log: logText })
                });

                const data = await response.json();

                // Affichage des résultats
                document.getElementById('resExplication').innerText = data.explication || 'Non précisée';
                document.getElementById('resSolution').innerText = data.solution || 'Aucune solution proposée';
                document.getElementById('badgeCriticite').innerText = data.criticite || 'Inconnue';
                document.getElementById('badgeSource').innerText = data.source || 'Interne';
                document.getElementById('resDocFile').innerText = data.fichier_source || 'N/A';

                document.getElementById('resultCard').style.display = 'block';
            } catch (err) {
                alert('Erreur lors de la communication avec le serveur Flask.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
