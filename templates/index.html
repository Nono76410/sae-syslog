<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Logs IA - Copier/Coller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <header class="pb-3 mb-4 border-bottom">
            <h1 class="h3">🔍 Analyseur de Logs & Docs Constructeurs</h1>
            <p class="text-muted m-0">Colle ton log brut ci-dessous pour obtenir un diagnostic instantané et la doc associée.</p>
        </header>

        <!-- Zone de texte pour copier-coller -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="mb-3">
                    <label for="logInput" class="form-label fw-bold">Colle ton log ici :</label>
                    <textarea class="form-control font-monospace" id="logInput" rows="5" placeholder="%OSPF-5-ADJCHG: Process 1..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="sendToAI()">Analyser le log</button>
            </div>
        </div>

        <!-- Résultat de l'analyse -->
        <div class="card shadow-sm" id="result-card" style="display: none;">
            <div class="card-header bg-dark text-white">Résultat de l'analyse IA</div>
            <div class="card-body">
                <p><strong>Équipement détecté :</strong> <span id="res-equipement">-</span></p>
                <p><strong>Criticité :</strong> <span id="res-criticite" class="badge bg-warning">-</span></p>
                <hr>
                <p><strong>Explication :</strong></p>
                <div class="p-3 bg-light border rounded" id="res-explication">-</div>
                <p class="mt-3"><strong>Documentation / Source :</strong></p>
                <div class="p-3 bg-white border rounded font-monospace small" id="res-doc">-</div>
            </div>
        </div>
    </div>

    <script>
        function sendToAI() {
            const logText = document.getElementById('logInput').value;
            if (!logText) return;

            fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ log: logText })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('res-equipement').textContent = data.equipement_detecte;
                document.getElementById('res-criticite').textContent = data.criticite;
                document.getElementById('res-explication').textContent = data.explication;
                document.getElementById('res-doc').textContent = data.doc_associee;
                
                document.getElementById('result-card').style.display = 'block';
            })
            .catch(error => console.error('Erreur:', error));
        }
    </script>

</body>
</html>
